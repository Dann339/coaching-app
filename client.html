<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon programme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- Page que le client ouvre sur son téléphone : son plan, ses séances, son progrès -->
<body class="vue-client">
  <header id="menu"><span class="marque"><span class="disque" aria-hidden="true"></span>Coach<b>Plan</b></span></header>

  <main id="contenu"></main>

  <script src="js/config.js"></script>
  <script src="js/stockage.js"></script>
  <script src="js/commun.js"></script>
  <script>
    // La page s'affiche quand les données en ligne sont chargées
    Donnees.pret.then(() => {
    const contenu = document.getElementById("contenu");
    const client = clientDuLien();
    // Deux vues : « Mon plan » (entraînements) et « Nutrition » (plan nutritionnel + recettes)
    const vueNutrition = parametre("vue") === "nutrition";
    if (client) afficherMenu(vueNutrition ? "nutrition" : "plan");

    if (!client) {
      contenu.innerHTML = `<div class="vide">Lien invalide. Demande à ton coach de te renvoyer ton lien.</div>`;
    } else {
      const prog = programmeDuClient(client.id);
      const code = "?code=" + encodeURIComponent(client.code);
      // Plan nutritionnel en cours (sinon le plus récent)
      const plans = db.plansNutrition.filter(p => p.clientId === client.id).sort((a, b) => b.debut.localeCompare(a.debut));
      const plan = plans.find(p => p.debut <= aujourdhui()) || plans[0];
      const recettesClient = plan?.recettes?.length ? db.recettes.filter(r => plan.recettes.includes(r.id)) : db.recettes;
      // ---------- Vue Nutrition ----------
      function htmlPlanNutrition() {
        if (!plan) return `<div class="vide">Ton coach n'a pas encore créé ton plan nutritionnel.</div>`;
        const ligne = (m, unite) => {
          const q = quantiteReelle(plan.objectifs[m.cle], plan.poids);
          return q ? `<tr><td>${m.nom}</td><td>${nombre(q)} ${unite}</td></tr>` : "";
        };
        return `
          <section class="carte">
            <h2>${txt(plan.nom)}</h2>
            <p class="meta">À partir du ${dateLisible(plan.debut)}, pendant ${plan.semaines} semaines. Objectifs par jour.</p>
            <table class="donnees">${MACROS.map(m => ligne(m, m.cle === "calories" ? "kcal" : "g")).join("")}</table>
            ${plan.notes ? `<p style="margin-top:12px;white-space:pre-line">${txt(plan.notes)}</p>` : ""}
          </section>`;
      }
      function htmlRecettes() {
        if (!recettesClient.length) return `<div class="vide">Aucune recette pour l'instant.</div>`;
        return recettesClient.map(r => `
          <details class="carte" style="margin-bottom:10px">
            <summary><strong style="font-family:var(--titres);font-size:1.3rem">${txt(r.titre)}</strong></summary>
            <div class="recette-detail">
              <div class="macros"><span><b>${r.calories || 0}</b> cal</span><span><b>${r.proteines || 0}</b> g prot.</span>
                <span><b>${r.glucides || 0}</b> g gluc.</span><span><b>${r.lipides || 0}</b> g lip.</span></div>
              ${blocVideo(r.video)}
              <ul>${(r.ingredients || []).map(i => `<li>${txt(i)}</li>`).join("")}</ul>
              <ol>${(r.etapes || []).map(e => `<li>${txt(e)}</li>`).join("")}</ol>
            </div>
          </details>`).join("");
      }
      if (vueNutrition) {
        document.title = "Ma nutrition";
        contenu.innerHTML = `
          <h1>Nutrition</h1>
          ${htmlPlanNutrition()}
          <h2 style="margin-top:28px">Recettes</h2>
          ${htmlRecettes()}`;
        return;
      }

      // ---------- Vue Mon plan (entraînements) ----------
      contenu.innerHTML = `
        <h1>Bonjour ${txt(client.nom.split(" ")[0])}</h1>
        <p class="sous-titre">${txt(client.objectifs)}</p>
        <div class="actions" style="margin:12px 0 20px">
          <a class="bouton principal" href="seance.html${code}${prog?.entrainements.length ? "" : "&entrainement=libre"}">Commencer une séance</a>
          <a class="bouton" href="progression.html${code}">Mon progrès</a>
          <a class="bouton" href="plan-pdf.html${code}">Télécharger mon plan en PDF</a>
        </div>

        <div class="filtres" role="tablist">
          ${(prog?.entrainements || []).map((w, i) => `<button role="tab" aria-pressed="${i === 0}" data-w="${i}">${txt(w.nom.split("—")[0].trim())}</button>`).join("")}
        </div>
        <div id="onglet"></div>`;

      function montrer(cle) {
        document.querySelectorAll("[data-w]").forEach(b => b.setAttribute("aria-pressed", b.dataset.w === String(cle)));
        const zone = document.getElementById("onglet");
        const w = prog.entrainements[cle];
        zone.innerHTML = `
          <div class="barre-outils" style="justify-content:space-between;margin-bottom:12px">
            <h2 style="margin:0">${txt(w.nom)}</h2>
            <a class="bouton principal" href="seance.html${code}&entrainement=${cle}">Commencer cette séance</a>
          </div>` + w.exercices.map((x, i) => {
          const ex = trouverExercice(x.exerciceId);
          if (!ex) return "";
          return `
          <section class="carte ex-seance">
            <div class="ex-seance-tete">
              ${ex.image ? `<img src="${txt(ex.image)}" alt="">` : ""}
              <div style="flex:1">
                <h3 style="margin:0">${i + 1}. ${txt(ex.nom)}</h3>
                <div class="cible">${cibleTexte(x)}</div>
                ${detailsExercice(x)}
                ${x.consignes ? `<p class="consigne">${txt(x.consignes)}</p>` : ""}
                ${ex.consignes ? `<p class="consigne">${txt(ex.consignes)}</p>` : ""}
              </div>
            </div>
            ${blocVideo(ex.video)}
          </section>`;
        }).join("");
      }

      document.querySelector(".filtres").onclick = e => {
        const b = e.target.closest("[data-w]");
        if (b) montrer(Number(b.dataset.w));
      };
      if (!prog?.entrainements.length) {
        document.getElementById("onglet").insertAdjacentHTML("beforebegin",
          `<p class="vide" style="margin-bottom:16px">Pas encore de programme. Clique sur « Commencer une séance » pour noter une séance libre :
            tu choisis tes exercices, puis tu notes le poids et les répétitions de chaque série.</p>`);
      }
      if (prog?.entrainements.length) montrer(0);
      else document.querySelector(".filtres").hidden = true;
    }
    });
  </script>
</body>
</html>
