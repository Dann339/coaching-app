<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Programme — CoachPlan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="menu"></header>

  <main>
    <div class="entete">
      <div>
        <h1>Programme</h1>
        <p class="sous-titre">Les changements sont enregistrés automatiquement.</p>
      </div>
      <div class="barre-outils" id="choix-client"></div>
    </div>

    <div id="zone-programme"></div>
  </main>

  <!-- Liste des noms d'exercices pour l'autocomplétion -->
  <datalist id="noms-exercices"></datalist>

  <script src="js/donnees-depart.js"></script>
  <script src="js/stockage.js"></script>
  <script src="js/commun.js"></script>
  <script>
    afficherMenu("programme");

    let clientId = clientCourant();
    const zone = document.getElementById("zone-programme");

    document.getElementById("noms-exercices").innerHTML =
      db.exercices.map(e => `<option value="${txt(e.nom)}">`).join("");

    function exerciceParNom(nom) {
      const n = nom.trim().toLowerCase();
      return db.exercices.find(e => e.nom.toLowerCase() === n);
    }

    function afficher() {
      if (!clientId) { zone.innerHTML = `<div class="vide">Un programme appartient à un client. <a href="index.html">Ajoute ton premier client</a>, puis reviens ici.</div>`; return; }
      const prog = programmeDuClient(clientId);
      if (!prog) {
        const autres = db.programmes.filter(p => trouverClient(p.clientId));
        zone.innerHTML = `
          <div class="vide">
            <p>${txt(trouverClient(clientId).nom)} n'a pas encore de programme.</p>
            <div class="actions" style="justify-content:center">
              <button class="principal" id="btn-creer">Créer un programme (4 entraînements)</button>
              ${autres.length ? `<label class="champ-inline">ou copier celui de
                <select id="copier-de"><option value="">choisir…</option>
                ${autres.map(p => `<option value="${p.id}">${txt(trouverClient(p.clientId).nom)} (${txt(p.nom)})</option>`).join("")}
                </select></label>` : ""}
            </div>
          </div>`;
        document.getElementById("btn-creer").onclick = () => {
          db.programmes.push({ id: Donnees.nouvelId("p"), clientId, nom: "Nouveau programme",
            // Même structure que ton Excel : 4 entraînements, à renommer au besoin
            entrainements: ["Entraînement 1 — Haut du corps", "Entraînement 2 — Bas du corps",
              "Entraînement 3 — Haut du corps", "Entraînement 4 — Bas du corps"]
              .map(nom => ({ id: Donnees.nouvelId("e"), nom, exercices: [] })) });
          enregistrer(); afficher();
        };
        const copier = document.getElementById("copier-de");
        if (copier) copier.onchange = () => {
          const source = db.programmes.find(p => p.id === copier.value);
          if (!source) return;
          const copie = JSON.parse(JSON.stringify(source));
          copie.id = Donnees.nouvelId("p"); copie.clientId = clientId;
          copie.entrainements.forEach(w => w.id = Donnees.nouvelId("e"));
          db.programmes.push(copie); enregistrer(); afficher();
          message("Programme copié");
        };
        return;
      }

      zone.innerHTML = `
        <div class="barre-outils" style="margin-bottom:16px">
          <label class="champ-inline" style="flex:1">Nom du programme
            <input id="nom-programme" value="${txt(prog.nom)}" style="max-width:360px"></label>
          <a class="bouton" href="seance.html?client=${clientId}">Commencer une séance</a>
        </div>
        ${prog.entrainements.map((w, i) => carteEntrainement(w, i)).join("")}
        <button class="principal" id="btn-ajout-entrainement">Ajouter un entraînement</button>`;

      document.getElementById("nom-programme").onchange = e => { prog.nom = e.target.value; enregistrer(); message("Enregistré"); };
      document.getElementById("btn-ajout-entrainement").onclick = () => {
        prog.entrainements.push({ id: Donnees.nouvelId("e"), nom: "Entraînement " + (prog.entrainements.length + 1), exercices: [] });
        enregistrer(); afficher();
      };
    }

    function carteEntrainement(w, i) {
      return `
      <section class="carte entrainement" data-w="${i}">
        <div class="entrainement-tete">
          <input value="${txt(w.nom)}" data-champ="nom-entrainement" aria-label="Nom de l'entraînement">
          <button class="petit danger" data-action="supprimer-entrainement">Supprimer</button>
        </div>
        <div class="ligne-ex ligne-titres"><span></span><span></span><span>Exercice</span>
          <span>Séries</span><span>Reps</span><span>Tempo</span><span>RIR</span><span>Repos</span><span></span></div>
        ${w.exercices.map((x, j) => {
          const ex = trouverExercice(x.exerciceId);
          return `
          <div class="ligne-ex" data-x="${j}">
            <span class="rang">${j + 1}</span>
            ${ex?.image
              ? `<img class="photo-ex" src="${txt(ex.image)}" alt="" loading="lazy">`
              : `<span class="photo-ex vide-photo" style="--c:${COULEURS_CATEGORIE[ex?.categorie] || "#5b6470"}">${ex ? txt(ex.nom[0]) : "?"}</span>`}
            <span class="nom-ex">
              <input list="noms-exercices" value="${txt(ex ? ex.nom : "")}" data-champ="exercice" aria-label="Exercice" placeholder="Choisir un exercice">
              ${ex ? `<span style="font-size:.8rem">${pastille(ex.categorie)}</span>` : ""}
            </span>
            ${[["series", "Séries", "3"], ["reps", "Reps", "10-12"], ["tempo", "Tempo", "3-1-1-0"], ["rir", "RIR", "1-2"], ["repos", "Repos", "90 s"]]
              .map(([cle, nom, exemple]) => `<label class="mini"><span>${nom}</span>
                <input value="${txt(x[cle] ?? "")}" data-champ="${cle}" aria-label="${nom}" placeholder="${exemple}"></label>`).join("")}
            <input class="consignes-ex" value="${txt(x.consignes)}" data-champ="consignes" aria-label="Consignes" placeholder="Autres consignes : superset, position, machine…">
            <span class="boutons-ligne">
              <button class="icone" data-action="monter" aria-label="Monter">↑</button>
              <button class="icone" data-action="descendre" aria-label="Descendre">↓</button>
              <button class="icone danger" data-action="retirer" aria-label="Retirer">✕</button>
            </span>
          </div>`;
        }).join("")}
        <div style="margin-top:10px"><button class="petit" data-action="ajouter-exercice">Ajouter un exercice</button></div>
      </section>`;
    }

    // Un seul écouteur pour toutes les modifications (plus simple à suivre)
    zone.addEventListener("change", e => {
      const prog = programmeDuClient(clientId);
      const carte = e.target.closest("[data-w]");
      if (!prog || !carte) return;
      const w = prog.entrainements[carte.dataset.w];
      const champ = e.target.dataset.champ;
      if (champ === "nom-entrainement") w.nom = e.target.value;
      const ligne = e.target.closest("[data-x]");
      if (ligne) {
        const x = w.exercices[ligne.dataset.x];
        if (champ === "exercice") {
          const ex = exerciceParNom(e.target.value);
          if (!ex) { message("Exercice introuvable : ajoute-le dans la bibliothèque"); return; }
          x.exerciceId = ex.id;
          enregistrer(); afficher(); return;
        }
        if (["series", "reps", "tempo", "rir", "repos", "consignes"].includes(champ)) x[champ] = e.target.value;
      }
      enregistrer();
      message("Enregistré");
    });

    zone.addEventListener("click", e => {
      const bouton = e.target.closest("[data-action]");
      if (!bouton) return;
      const prog = programmeDuClient(clientId);
      const carte = bouton.closest("[data-w]");
      const w = prog.entrainements[carte.dataset.w];
      const ligne = bouton.closest("[data-x]");
      const j = ligne ? Number(ligne.dataset.x) : -1;
      switch (bouton.dataset.action) {
        case "ajouter-exercice":
          w.exercices.push({ exerciceId: "", series: "3", reps: "10-12", tempo: "", rir: "", repos: "", consignes: "" }); break;
        case "retirer": w.exercices.splice(j, 1); break;
        case "monter": if (j > 0) [w.exercices[j - 1], w.exercices[j]] = [w.exercices[j], w.exercices[j - 1]]; break;
        case "descendre": if (j < w.exercices.length - 1) [w.exercices[j + 1], w.exercices[j]] = [w.exercices[j], w.exercices[j + 1]]; break;
        case "supprimer-entrainement":
          if (!confirm("Supprimer « " + w.nom + " » ?")) return;
          prog.entrainements.splice(carte.dataset.w, 1); break;
      }
      enregistrer(); afficher();
      if (bouton.dataset.action === "ajouter-exercice") {
        const champs = zone.querySelectorAll(`[data-w="${carte.dataset.w}"] [data-champ="exercice"]`);
        champs[champs.length - 1]?.focus();
      }
    });

    selecteurClient(clientId, id => { clientId = id; afficherMenu("programme"); afficher(); });
    afficher();
  </script>
</body>
</html>
