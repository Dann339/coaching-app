<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan d'entraînement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ============================================================
       VERSION PDF DU PLAN
       Le bouton « Télécharger en PDF » ouvre la fenêtre d'impression :
       choisir « Enregistrer au format PDF » comme imprimante.
       ============================================================ */
    body { background: #e9ecee; padding-bottom: 0; }
    .options {
      max-width: 816px; margin: 0 auto; padding: 16px;
      display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: end;
    }
    .options label { margin: 0; }
    .options .coches { display: flex; gap: 14px; flex-wrap: wrap; }
    .options .coches label { display: flex; gap: 6px; align-items: center; font-weight: 500; }
    .options .coches input { width: auto; margin: 0; }
    .options .identite { display: flex; gap: 10px; flex-wrap: wrap; }
    .options .identite input { width: 190px; }

    /* La feuille : format lettre à l'écran */
    .feuille {
      background: #fff; max-width: 816px; margin: 0 auto 32px; padding: 32px 40px;
      box-shadow: 0 2px 12px rgba(23, 32, 42, .15); color: #17202a; font-size: 13px; line-height: 1.4;
    }
    .cadre { width: 100%; border-collapse: collapse; }
    .cadre > thead td, .cadre > tfoot td { padding: 0; }
    .tete {
      display: flex; justify-content: space-between; align-items: end; gap: 20px;
      border-bottom: 1px solid #17202a; padding-bottom: 8px; margin-bottom: 18px;
    }
    .tete .entreprise { color: #5b6470; }
    .tete .titre { text-align: right; }
    .tete .titre b { font-size: 14px; }
    .tete .titre span { color: #5b6470; font-size: 12px; }
    .pied-page {
      border-top: 1px solid #17202a; margin-top: 18px; padding-top: 6px;
      display: flex; justify-content: space-between; color: #5b6470; font-size: 11px;
    }

    .bloc-entrainement + .bloc-entrainement { break-before: page; }
    .bloc-entrainement h2 { font-family: var(--titres); font-size: 22px; margin: 0 0 10px; }
    .ex {
      display: grid; grid-template-columns: 42% 1fr; gap: 16px;
      padding: 10px 0 12px; border-bottom: 1px solid #d8dcdf;
      break-inside: avoid;
    }
    .ex-nom { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .ex-photos { display: flex; gap: 6px; }
    .ex-photos img { width: 48%; max-height: 120px; object-fit: cover; border-radius: 4px; background: #eef0f1; }
    .ex-texte p { margin: 0 0 4px; }
    .ex-texte .note { color: #5b6470; }
    table.cibles { border-collapse: collapse; margin-top: 8px; width: 100%; }
    table.cibles th {
      background: #e3e6e8; font-weight: 500; font-size: 11px; padding: 2px 6px; text-align: center;
      border-right: 2px solid #fff;
    }
    table.cibles td { font-weight: 700; text-align: center; padding: 4px 6px; font-size: 13px; }
    .lien-video { font-size: 11px; }

    .nutrition h2 { font-family: var(--titres); font-size: 22px; margin: 0 0 6px; }
    .nutrition table.cibles { width: auto; min-width: 60%; }
    .recette { break-inside: avoid; border-bottom: 1px solid #d8dcdf; padding: 10px 0; }
    .recette h3 { font-size: 15px; margin: 0 0 4px; font-family: var(--texte); }
    .recette ul, .recette ol { margin: 4px 0; padding-left: 18px; }
    .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    @media (max-width: 640px) {
      .feuille { padding: 20px 16px; }
      .ex, .deux { grid-template-columns: 1fr; }
      table.cibles { font-size: 11px; }
    }

    /* Impression / PDF */
    @page { size: letter; margin: 12mm 12mm 12mm; }
    @media print {
      body { background: #fff; }
      #menu, .options, #toast { display: none !important; }
      .feuille { box-shadow: none; margin: 0; padding: 0; max-width: none; }
      a { color: inherit; text-decoration: none; }
      .ex { grid-template-columns: 42% 1fr; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <header id="menu"></header>

  <div class="options" id="options">
    <div class="coches">
      <label><input type="checkbox" id="inclure-entrainement" checked> Entraînements</label>
      <label><input type="checkbox" id="inclure-nutrition" checked> Nutrition</label>
      <label><input type="checkbox" id="inclure-recettes" checked> Recettes</label>
    </div>
    <div class="identite" id="identite">
      <label>Ton nom <input id="nom-coach" placeholder="Ex. : Daniel Acosta"></label>
      <label>Entreprise <input id="nom-entreprise" placeholder="Ex. : Fitness Performance"></label>
    </div>
    <span class="actions">
      <button id="btn-retour" type="button">Retour</button>
      <button class="principal" id="btn-pdf" type="button">Télécharger en PDF</button>
    </span>
  </div>

  <div class="feuille" id="feuille"></div>

  <script src="js/config.js"></script>
  <script src="js/stockage.js"></script>
  <script src="js/commun.js"></script>
  <script>
    // La page s'affiche quand les données en ligne sont chargées
    Donnees.pret.then(() => {
    // Ouvert par le coach (?client=…) ou par le client (?code=…)
    const parCode = parametre("code");
    const client = parCode
      ? db.clients.find(c => c.code && c.code === parCode)
      : trouverClient(parametre("client") || "");
    db.reglages ||= {};

    if (parCode) {
      document.getElementById("menu").remove();
      document.getElementById("identite").remove(); // le client ne modifie pas ces infos
    } else {
      afficherMenu("programme");
      document.getElementById("nom-coach").value = db.reglages.coach || "";
      document.getElementById("nom-entreprise").value = db.reglages.entreprise || "";
    }

    // Deuxième photo (position finale) quand l'image vient de free-exercise-db
    function photos(ex) {
      if (!ex.image) return "";
      const fin = ex.image.includes("free-exercise-db") ? ex.image.replace(/\/0\.jpg$/, "/1.jpg") : null;
      return `<div class="ex-photos"><img src="${txt(ex.image)}" alt="">${fin && fin !== ex.image ? `<img src="${txt(fin)}" alt="">` : ""}</div>`;
    }

    // Petit tableau des cibles : seulement les colonnes remplies
    function tableauCibles(colonnes) {
      const remplies = colonnes.filter(([, v]) => v !== undefined && v !== null && String(v).trim() !== "");
      if (!remplies.length) return "";
      return `<table class="cibles"><thead><tr>${remplies.map(([t]) => `<th>${t}</th>`).join("")}</tr></thead>
        <tbody><tr>${remplies.map(([, v]) => `<td>${txt(v)}</td>`).join("")}</tr></tbody></table>`;
    }

    function pageEntrainements(prog) {
      if (!prog || !prog.entrainements.length) return "";
      return prog.entrainements.filter(w => w.exercices.length).map(w => `
        <section class="bloc-entrainement">
          <h2>${txt(w.nom)}</h2>
          ${w.exercices.map((x, i) => {
            const ex = trouverExercice(x.exerciceId);
            if (!ex) return "";
            return `
            <div class="ex">
              <div>
                <div class="ex-nom">${i + 1} - ${txt(ex.nom)}</div>
                ${photos(ex)}
              </div>
              <div class="ex-texte">
                ${ex.consignes ? `<p>- ${txt(ex.consignes)}</p>` : ""}
                ${x.consignes ? `<p class="note">${txt(x.consignes)}</p>` : ""}
                ${tableauCibles([["Séries", x.series], ["Rep", x.reps], ["Tempo", x.tempo], ["RIR", x.rir], ["Repos", x.repos]])}
                ${ex.video ? `<p class="lien-video" style="margin-top:6px">Vidéo : <a href="${txt(ex.video)}">${txt(ex.video)}</a></p>` : ""}
              </div>
            </div>`;
          }).join("")}
        </section>`).join("");
    }

    function pageNutrition(plan) {
      if (!plan) return "";
      return `
        <section class="bloc-entrainement nutrition">
          <h2>Nutrition : ${txt(plan.nom)}</h2>
          <p class="note" style="color:#5b6470">À partir du ${dateLisible(plan.debut)}, pendant ${plan.semaines} semaines. Objectifs par jour.</p>
          ${tableauCibles(MACROS.map(m => {
            const q = quantiteReelle(plan.objectifs[m.cle], plan.poids);
            return [m.nom + (m.cle === "calories" ? " (kcal)" : " (g)"), q ? nombre(q) : ""];
          }))}
          ${plan.notes ? `<p style="margin-top:12px;white-space:pre-line">${txt(plan.notes)}</p>` : ""}
        </section>`;
    }

    function pageRecettes(liste) {
      if (!liste.length) return "";
      return `
        <section class="bloc-entrainement">
          <h2 style="font-family:var(--titres);font-size:22px;margin:0 0 6px">Recettes</h2>
          ${liste.map(r => `
            <div class="recette">
              <h3>${txt(r.titre)}</h3>
              <p style="color:#5b6470;margin:0 0 6px">${r.portions || 1} portion(s), par portion : ${r.calories || 0} kcal,
                ${r.proteines || 0} g protéines, ${r.glucides || 0} g glucides, ${r.lipides || 0} g lipides</p>
              <div class="deux">
                <div><b>Ingrédients</b><ul>${(r.ingredients || []).map(i => `<li>${txt(i)}</li>`).join("")}</ul></div>
                <div><b>Étapes</b><ol>${(r.etapes || []).map(e => `<li>${txt(e)}</li>`).join("")}</ol></div>
              </div>
              ${r.video ? `<p class="lien-video">Vidéo : <a href="${txt(r.video)}">${txt(r.video)}</a></p>` : ""}
            </div>`).join("")}
        </section>`;
    }

    function afficher() {
      const feuille = document.getElementById("feuille");
      if (!client) { feuille.innerHTML = `<div class="vide">Client introuvable.</div>`; return; }
      const prog = programmeDuClient(client.id);
      const plan = planNutritionDuClient(client.id);
      const recettes = plan?.recettes?.length ? db.recettes.filter(r => plan.recettes.includes(r.id)) : db.recettes;

      const coach = db.reglages.coach, entreprise = db.reglages.entreprise;
      const titre = [client.nom, prog?.nom].filter(Boolean).map(txt).join(" | ");
      document.title = `${client.nom} - ${prog?.nom || "Plan"}`; // devient le nom du fichier PDF

      const contenu = [
        document.getElementById("inclure-entrainement").checked ? pageEntrainements(prog) : "",
        document.getElementById("inclure-nutrition").checked ? pageNutrition(plan) : "",
        document.getElementById("inclure-recettes").checked ? pageRecettes(recettes) : "",
      ].join("");

      // Le tableau « cadre » répète l'en-tête et le pied de page sur chaque page imprimée
      feuille.innerHTML = `
        <table class="cadre">
          <thead><tr><td>
            <div class="tete">
              <div class="entreprise">${txt(entreprise || "")}</div>
              <div class="titre"><b>${titre}</b>
                <span>${coach ? " par " + txt(coach) : ""} | ${aujourdhui()}</span></div>
            </div>
          </td></tr></thead>
          <tbody><tr><td>${contenu || `<div class="vide">Rien à afficher : coche au moins une section, ou ajoute un programme.</div>`}</td></tr></tbody>
          <tfoot><tr><td>
            <div class="pied-page"><span>${txt(entreprise || "")}</span><span>Préparé avec CoachPlan</span></div>
          </td></tr></tfoot>
        </table>`;

      // Cacher les cases inutiles
      document.getElementById("inclure-nutrition").parentElement.hidden = !plan;
    }

    document.querySelectorAll(".coches input").forEach(c => c.onchange = afficher);
    ["nom-coach", "nom-entreprise"].forEach(id => {
      const champ = document.getElementById(id);
      if (champ) champ.onchange = () => {
        db.reglages.coach = document.getElementById("nom-coach").value.trim();
        db.reglages.entreprise = document.getElementById("nom-entreprise").value.trim();
        enregistrer(); afficher();
      };
    });

    // Attendre que les photos soient chargées avant d'ouvrir la fenêtre PDF
    document.getElementById("btn-pdf").onclick = async () => {
      await Promise.all([...document.images].map(img => img.complete ? null :
        new Promise(ok => { img.onload = img.onerror = ok; setTimeout(ok, 4000); })));
      window.print();
    };
    document.getElementById("btn-retour").onclick = () => history.length > 1 ? history.back() : (location.href = "index.html");

    afficher();
    });
  </script>
</body>
</html>
