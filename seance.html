<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Séance — CoachPlan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="menu"></header>

  <main>
    <div class="entete">
      <div>
        <h1 id="titre-page">Nouvelle séance</h1>
        <p class="sous-titre">Les exercices viennent du programme. Tu peux les changer pour cette séance.</p>
      </div>
      <div class="barre-outils">
        <span id="choix-client"></span>
        <label class="champ-inline">Entraînement <select id="select-entrainement"></select></label>
        <label class="champ-inline">Date <input type="date" id="date-seance" style="width:auto"></label>
      </div>
    </div>

    <div id="zone-seance"></div>

    <h2 style="margin-top:32px">Séances récentes</h2>
    <div class="carte tableau-defile"><table class="donnees" id="recentes"></table></div>
  </main>

  <!-- Liste des noms d'exercices pour ajouter ou remplacer -->
  <datalist id="noms-exercices"></datalist>

  <script src="js/config.js"></script>
  <script src="js/stockage.js"></script>
  <script src="js/commun.js"></script>
  <script>
    // La page s'affiche quand les données en ligne sont chargées
    Donnees.pret.then(() => {
    afficherMenu("seance");

    let clientId = clientCourant();
    const zone = document.getElementById("zone-seance");
    const selectEntrainement = document.getElementById("select-entrainement");
    const champDate = document.getElementById("date-seance");

    // La séance en cours (brouillon) : tout ce qu'on voit à l'écran est ici
    let brouillon = null;
    let premierAffichage = true;

    document.getElementById("noms-exercices").innerHTML =
      db.exercices.map(e => `<option value="${txt(e.nom)}">`).join("");
    function exerciceParNom(nom) {
      const n = nom.trim().toLowerCase();
      return db.exercices.find(e => e.nom.toLowerCase() === n);
    }

    // Les séries de la dernière séance où ce client a fait cet exercice
    function dernieresSeries(exerciceId) {
      for (const s of seancesDuClient(clientId)) {
        if (brouillon?.seanceId === s.id) continue;
        const x = s.exercices.find(x => x.exerciceId === exerciceId);
        if (x && x.series.length) return x.series;
      }
      return [];
    }

    function remplirEntrainements() {
      const prog = programmeDuClient(clientId);
      selectEntrainement.innerHTML =
        (prog ? prog.entrainements.map((w, i) => `<option value="${i}">${txt(w.nom)}</option>`).join("") : "")
        + `<option value="libre">Séance libre (choisir mes exercices)</option>`;
      // L'entraînement demandé dans l'adresse (?entrainement=…) ne sert qu'à l'ouverture de la page
      const demandeTexte = premierAffichage ? parametre("entrainement") : null;
      premierAffichage = false;
      if (!prog || !prog.entrainements.length || demandeTexte === "libre") { selectEntrainement.value = "libre"; return; }
      // Entraînement demandé, sinon celui qui suit le dernier fait
      const demande = Number(demandeTexte);
      if (demandeTexte !== null && prog.entrainements[demande]) {
        selectEntrainement.value = String(demande);
      } else {
        const derniere = seancesDuClient(clientId)[0];
        const index = derniere ? prog.entrainements.findIndex(w => w.nom === derniere.entrainement) : -1;
        selectEntrainement.value = String((index + 1) % prog.entrainements.length);
      }
    }

    // L'entraînement choisi dans la liste (null pour une séance libre)
    function entrainementChoisi() {
      if (selectEntrainement.value === "libre") return null;
      return programmeDuClient(clientId)?.entrainements[selectEntrainement.value] || null;
    }

    function serieVide() { return { poids: null, reps: null, temps: null }; }
    function serieRemplie(s) { return s.poids !== null || s.reps !== null || s.temps !== null; }

    // Crée une ligne d'exercice du brouillon à partir d'un exercice du programme
    function ligneDepuisProgramme(x) {
      const nb = parseInt(x.series) || 3;
      return {
        exerciceId: x.exerciceId,
        mode: x.mode || "reps",
        cible: { series: x.series, reps: x.reps, mode: x.mode, tempo: x.tempo, rir: x.rir, repos: x.repos, consignes: x.consignes },
        series: Array.from({ length: nb }, () => serieVide()),
        commentaire: "",
      };
    }

    // Nouveau brouillon à partir de l'entraînement choisi
    function nouveauBrouillon() {
      const w = entrainementChoisi();
      brouillon = {
        seanceId: null,
        entrainementIndex: selectEntrainement.value,
        exercices: w ? w.exercices.filter(x => trouverExercice(x.exerciceId)).map(ligneDepuisProgramme) : [],
        cardio: [{ activite: "", minutes: "" }, { activite: "", minutes: "" }, { activite: "", minutes: "" }],
        notes: "",
      };
      champDate.value = aujourdhui();
    }

    // Ouvrir une séance déjà enregistrée pour la modifier
    // copie = true : nouvelle séance (date d'aujourd'hui) qui reprend les exercices et les valeurs d'une séance passée
    function modifierSeance(s, copie = false) {
      const prog = programmeDuClient(clientId);
      const index = prog ? prog.entrainements.findIndex(w => w.nom === s.entrainement) : -1;
      selectEntrainement.value = index >= 0 ? String(index) : "libre";
      const w = prog?.entrainements[index];
      brouillon = {
        seanceId: copie ? null : s.id,
        entrainementIndex: selectEntrainement.value,
        exercices: s.exercices.map(x => {
          const cible = w?.exercices.find(p => p.exerciceId === x.exerciceId) || {};
          return { exerciceId: x.exerciceId, mode: x.mode || cible.mode || "reps", commentaire: x.commentaire || "",
            cible: { ...cible }, series: x.series.map(r => ({ ...serieVide(), ...r })) };
        }),
        cardio: [...s.cardio.map(c => ({ ...c })), { activite: "", minutes: "" }],
        notes: s.notes || "",
      };
      champDate.value = copie ? aujourdhui() : s.date;
      if (copie) message(`Séance du ${dateLisible(s.date)} copiée : ajuste les valeurs puis enregistre`);
      afficher();
      window.scrollTo({ top: 0 });
    }

    function ligneSerie(i, k, serie, precedent, mode) {
      const enTemps = mode === "temps";
      return `<tr>
        <td>${k + 1}</td>
        <td><input type="number" inputmode="decimal" step="0.5" min="0" data-ex="${i}" data-serie="${k}" data-champ="poids"
             value="${serie.poids ?? ""}" aria-label="Poids série ${k + 1}"></td>
        <td><input type="number" inputmode="numeric" step="1" min="0" data-ex="${i}" data-serie="${k}" data-champ="${enTemps ? "temps" : "reps"}"
             value="${(enTemps ? serie.temps : serie.reps) ?? ""}" aria-label="${enTemps ? "Temps en secondes" : "Reps"} série ${k + 1}"></td>
        <td class="precedent">${serieTexte(precedent)}</td>
        <td><button class="icone" data-action="retirer-serie" data-ex="${i}" data-serie="${k}" aria-label="Retirer la série ${k + 1}">−</button></td>
      </tr>`;
    }

    function carteExercice(x, i) {
      const ex = trouverExercice(x.exerciceId);
      if (!ex) return "";
      const avant = dernieresSeries(ex.id);
      const c = x.cible || {};
      const ajoute = !c.series && !c.reps;
      const enTemps = x.mode === "temps";
      return `
      <section class="carte ex-seance">
        <div class="ex-seance-tete">
          ${ex.image ? `<img src="${txt(ex.image)}" alt="">` : ""}
          <div style="flex:1">
            <h3 style="margin:0">${i + 1}. ${txt(ex.nom)}</h3>
            ${ajoute ? `<p class="consigne">Ajouté pour cette séance</p>` : `
              <div class="cible">${cibleTexte(c)}</div>
              ${detailsExercice(c)}
              ${c.consignes ? `<p class="consigne">${txt(c.consignes)}</p>` : ""}`}
          </div>
          <span class="boutons-ligne">
            ${ex.video ? `<a class="bouton petit" href="${txt(ex.video)}" target="_blank" rel="noopener">Vidéo</a>` : ""}
            <button class="icone" data-action="monter" data-ex="${i}" aria-label="Monter">↑</button>
            <button class="icone" data-action="descendre" data-ex="${i}" aria-label="Descendre">↓</button>
            <button class="icone danger" data-action="retirer-exercice" data-ex="${i}" aria-label="Retirer ${txt(ex.nom)}">✕</button>
          </span>
        </div>
        <table class="series">
          <thead><tr><th>Série</th><th>Poids (lb)</th><th>${enTemps ? "Temps (s)" : "Reps"}</th><th>Dernière fois</th><th></th></tr></thead>
          <tbody>${x.series.map((s, k) => ligneSerie(i, k, s, avant[k], x.mode)).join("")}</tbody>
        </table>
        <div class="actions" style="margin-top:6px;align-items:center">
          <label class="champ-inline" style="font-weight:500">Mesurer en
            <select data-mode data-ex="${i}" aria-label="Mesurer en répétitions ou en temps">
              <option value="reps" ${enTemps ? "" : "selected"}>Répétitions</option>
              <option value="temps" ${enTemps ? "selected" : ""}>Temps (secondes)</option>
            </select></label>
          <button class="petit" data-action="ajouter-serie" data-ex="${i}">Ajouter une série</button>
          <button class="petit" data-action="remplacer" data-ex="${i}">Remplacer l'exercice</button>
        </div>
        <input class="commentaire-ex" data-commentaire data-ex="${i}" value="${txt(x.commentaire || "")}"
          placeholder="Commentaire sur cet exercice (sensation, douleur, charge…)" aria-label="Commentaire sur ${txt(ex.nom)}">
        <div class="remplacement" data-remplacer="${i}" hidden>
          <label style="margin:8px 0 0">Remplacer par
            <input list="noms-exercices" data-action-input="remplacer" data-ex="${i}" placeholder="Écris le nom d'un exercice"></label>
        </div>
      </section>`;
    }

    function afficher() {
      const prog = programmeDuClient(clientId);
      if (!brouillon) nouveauBrouillon();
      const enEdition = !!brouillon.seanceId;
      const libre = selectEntrainement.value === "libre";
      document.getElementById("titre-page").textContent = enEdition ? `Modifier la séance du ${dateLisible(champDate.value)}`
        : enModeClient() ? "Ma séance" : "Nouvelle séance";

      // Exercices des autres entraînements du programme, proposés en premier pour l'ajout
      const autres = [...new Set((prog?.entrainements || []).flatMap(w => w.exercices.map(x => x.exerciceId)))]
        .filter(id => trouverExercice(id) && !brouillon.exercices.some(x => x.exerciceId === id));

      zone.innerHTML = `
        ${enEdition ? `<p class="bandeau-demo">Tu modifies une séance déjà enregistrée.
          <button class="petit" data-action="annuler-modif">Annuler et commencer une nouvelle séance</button></p>` : ""}
        ${brouillon.exercices.map(carteExercice).join("") || `<div class="vide" style="margin-bottom:14px">${libre
          ? "Séance libre : ajoute tes exercices ci-dessous. Pour chaque série, note le poids et les répétitions (ou le temps)."
          : "Aucun exercice dans cette séance."}</div>`}

        <section class="carte ex-seance">
          <h3>Ajouter un exercice à cette séance</h3>
          <div class="barre-outils">
            ${autres.length ? `<label class="champ-inline">Du programme
              <select id="ajout-programme"><option value="">Choisir…</option>
              ${autres.map(id => `<option value="${id}">${txt(trouverExercice(id).nom)}</option>`).join("")}</select></label>` : ""}
            <label class="champ-inline">De la bibliothèque
              <input list="noms-exercices" id="ajout-biblio" placeholder="Nom de l'exercice"></label>
          </div>
        </section>

        <section class="carte ex-seance">
          <h3>Cardio</h3>
          <table class="series">
            <thead><tr><th></th><th>Activité</th><th>Minutes</th></tr></thead>
            <tbody>${brouillon.cardio.map((c, n) => `<tr><td>${n + 1}</td>
              <td><input data-cardio="${n}" data-champ="activite" value="${txt(c.activite)}" placeholder="Tapis roulant, escalier…" aria-label="Activité ${n + 1}" style="max-width:none"></td>
              <td><input type="number" inputmode="numeric" min="0" data-cardio="${n}" data-champ="minutes" value="${c.minutes ?? ""}" aria-label="Minutes ${n + 1}"></td></tr>`).join("")}
            </tbody>
          </table>
          <label style="margin-top:12px">${enModeClient() ? "Commentaires sur ma séance (ton coach les verra)" : "Notes / commentaires de séance"}
            <textarea id="notes" placeholder="Énergie, sommeil, douleur, ce qui était facile ou difficile…">${txt(brouillon.notes)}</textarea></label>
        </section>

        <div class="barre-collante">
          <label class="champ-inline" style="font-weight:500;margin-right:auto">
            <input type="checkbox" id="maj-programme" style="width:auto"> ${libre
              ? "Garder ces exercices comme nouvel entraînement du programme"
              : "Appliquer ces changements d'exercices au programme"}
          </label>
          <button class="principal" id="btn-enregistrer">${enEdition ? "Enregistrer les modifications" : "Enregistrer la séance"}</button>
        </div>`;

      document.getElementById("btn-enregistrer").onclick = enregistrerSeance;
      afficherRecentes();
    }

    // Ce qu'on tape est gardé tout de suite dans le brouillon
    zone.addEventListener("input", e => {
      const t = e.target;
      if (t.dataset.serie !== undefined) {
        const v = t.value === "" ? null : Number(t.value);
        brouillon.exercices[t.dataset.ex].series[t.dataset.serie][t.dataset.champ] = v;
      } else if (t.dataset.cardio !== undefined) {
        brouillon.cardio[t.dataset.cardio][t.dataset.champ] = t.value;
      } else if (t.dataset.commentaire !== undefined) {
        brouillon.exercices[t.dataset.ex].commentaire = t.value;
      } else if (t.id === "notes") brouillon.notes = t.value;
    });

    zone.addEventListener("change", e => {
      const t = e.target;
      if (t.dataset.mode !== undefined) {
        brouillon.exercices[t.dataset.ex].mode = t.value;
        afficher(); return;
      }
      if (t.id === "ajout-programme" && t.value) {
        const p = programmeDuClient(clientId);
        const source = p.entrainements.flatMap(w => w.exercices).find(x => x.exerciceId === t.value);
        brouillon.exercices.push(ligneDepuisProgramme(source));
        afficher(); message("Exercice ajouté");
      }
      if (t.id === "ajout-biblio" || t.dataset.actionInput === "remplacer") {
        const ex = exerciceParNom(t.value);
        if (!ex) { message("Exercice introuvable dans la bibliothèque"); return; }
        if (t.id === "ajout-biblio") {
          brouillon.exercices.push({ exerciceId: ex.id, mode: "reps", commentaire: "", cible: {}, series: [serieVide(), serieVide(), serieVide()] });
          message("Exercice ajouté");
        } else {
          brouillon.exercices[t.dataset.ex].exerciceId = ex.id;
          message("Exercice remplacé");
        }
        afficher();
      }
    });

    zone.addEventListener("click", e => {
      const b = e.target.closest("[data-action]");
      if (!b) return;
      const i = Number(b.dataset.ex);
      const liste = brouillon.exercices;
      switch (b.dataset.action) {
        case "ajouter-serie": liste[i].series.push(serieVide()); break;
        case "retirer-serie": liste[i].series.splice(Number(b.dataset.serie), 1); break;
        case "retirer-exercice":
          if (!confirm("Retirer cet exercice de la séance ?")) return;
          liste.splice(i, 1); break;
        case "monter": if (i > 0) [liste[i - 1], liste[i]] = [liste[i], liste[i - 1]]; break;
        case "descendre": if (i < liste.length - 1) [liste[i + 1], liste[i]] = [liste[i], liste[i + 1]]; break;
        case "remplacer": {
          const boite = zone.querySelector(`[data-remplacer="${i}"]`);
          boite.hidden = !boite.hidden;
          if (!boite.hidden) boite.querySelector("input").focus();
          return;
        }
        case "annuler-modif": brouillon = null; break;
        default: return;
      }
      afficher();
    });

    function enregistrerSeance() {
      let w = entrainementChoisi();
      const exercices = brouillon.exercices.map(x => {
        const enTemps = x.mode === "temps";
        const series = x.series.filter(serieRemplie).map(s => enTemps
          ? { poids: s.poids, temps: s.temps }
          : { poids: s.poids, reps: s.reps });
        const ligne = { exerciceId: x.exerciceId, series };
        if (enTemps) ligne.mode = "temps";
        if ((x.commentaire || "").trim()) ligne.commentaire = x.commentaire.trim();
        return ligne;
      }).filter(x => x.series.length || x.commentaire);
      const cardio = brouillon.cardio
        .map(c => ({ activite: (c.activite || "").trim(), minutes: Number(c.minutes) || 0 }))
        .filter(c => c.activite || c.minutes);

      if (!exercices.length && !cardio.length) { message("Rien à enregistrer : inscris au moins une série"); return; }

      // Option : le programme prend la nouvelle liste d'exercices (les cibles déjà notées sont gardées)
      const majProgramme = document.getElementById("maj-programme").checked && brouillon.exercices.length;
      if (majProgramme && !w) {
        // Séance libre gardée comme nouvel entraînement (crée le programme au besoin)
        let prog = programmeDuClient(clientId);
        if (!prog) {
          prog = { id: Donnees.nouvelId("p"), clientId, nom: "Mon programme", entrainements: [] };
          db.programmes.push(prog);
        }
        const nom = prompt("Nom de cet entraînement :", `Entraînement ${prog.entrainements.length + 1}`);
        if (nom) {
          w = { id: Donnees.nouvelId("e"), nom: nom.trim(), exercices: [] };
          prog.entrainements.push(w);
        }
      }
      if (majProgramme && w) {
        w.exercices = brouillon.exercices.map(x => {
          const existant = w.exercices.find(p => p.exerciceId === x.exerciceId);
          const c = x.cible || {};
          return existant || { exerciceId: x.exerciceId, mode: x.mode === "temps" ? "temps" : undefined,
            series: c.series || String(x.series.length || 3), reps: c.reps || (x.mode === "temps" ? "30" : "10-12"),
            tempo: c.tempo || "", rir: c.rir || "", repos: c.repos || "", consignes: c.consignes || "" };
        });
      }

      const donnees = {
        clientId, date: champDate.value || aujourdhui(),
        entrainement: w ? w.nom : "Séance libre", exercices, cardio, notes: brouillon.notes,
      };
      if (brouillon.seanceId) {
        Object.assign(db.seances.find(s => s.id === brouillon.seanceId), donnees);
        message("Séance modifiée");
      } else {
        db.seances.push({ id: Donnees.nouvelId("s"), ...donnees });
        message("Séance enregistrée");
      }
      enregistrer();
      brouillon = null;
      window.scrollTo({ top: 0 });
      remplirEntrainements();
      afficher();
    }

    // Commentaires d'une séance (général + par exercice), affichés sous sa ligne
    function commentairesSeance(s) {
      const parExercice = s.exercices.filter(x => x.commentaire)
        .map(x => `<li><b>${txt(trouverExercice(x.exerciceId)?.nom || "Exercice")} :</b> ${txt(x.commentaire)}</li>`);
      if (!s.notes && !parExercice.length) return "";
      return `<tr class="ligne-commentaire"><td colspan="6">
        ${s.notes ? `<p><b>Commentaire :</b> ${txt(s.notes)}</p>` : ""}
        ${parExercice.length ? `<ul>${parExercice.join("")}</ul>` : ""}</td></tr>`;
    }

    function afficherRecentes() {
      const seances = seancesDuClient(clientId).slice(0, 10);
      document.getElementById("recentes").innerHTML = seances.length ? `
        <thead><tr><th>Date</th><th>Entraînement</th><th>Exercices</th><th>Cardio (min)</th><th>Volume (lb)</th><th></th></tr></thead>
        <tbody>${seances.map(s => `<tr>
          <td>${dateLisible(s.date)}</td><td>${txt(s.entrainement)}</td><td>${s.exercices.length}</td>
          <td>${s.cardio.reduce((t, c) => t + (Number(c.minutes) || 0), 0)}</td>
          <td>${nombre(s.exercices.reduce((t, x) => t + volume(x.series), 0))}</td>
          <td style="white-space:nowrap">
            <button class="petit" data-copier="${s.id}" title="Nouvelle séance avec les mêmes exercices et valeurs">Copier</button>
            <button class="petit" data-modifier="${s.id}">Modifier</button>
            <button class="icone danger" data-supprimer="${s.id}" aria-label="Supprimer la séance">✕</button></td></tr>
          ${commentairesSeance(s)}`).join("")}
        </tbody>` : `<tbody><tr><td class="meta">Aucune séance pour l'instant.</td></tr></tbody>`;
    }
    document.getElementById("recentes").onclick = e => {
      const c = e.target.closest("[data-copier]");
      if (c) { modifierSeance(db.seances.find(s => s.id === c.dataset.copier), true); return; }
      const m = e.target.closest("[data-modifier]");
      if (m) { modifierSeance(db.seances.find(s => s.id === m.dataset.modifier)); return; }
      const b = e.target.closest("[data-supprimer]");
      if (!b || !confirm("Supprimer cette séance ?")) return;
      db.seances = db.seances.filter(s => s.id !== b.dataset.supprimer);
      if (brouillon?.seanceId === b.dataset.supprimer) brouillon = null;
      enregistrer(); afficher(); message("Séance supprimée");
    };

    selectEntrainement.onchange = () => {
      const commence = brouillon?.exercices.some(x => x.series.some(serieRemplie));
      if (commence && !confirm("Changer d'entraînement efface ce que tu as noté. Continuer ?")) {
        selectEntrainement.value = String(brouillon.entrainementIndex); return;
      }
      brouillon = null; afficher();
    };
    if (clientId) {
      selecteurClient(clientId, id => { clientId = id; brouillon = null; afficherMenu("seance"); remplirEntrainements(); afficher(); });
      remplirEntrainements();
      afficher();
    } else {
      zone.innerHTML = `<div class="vide">Ajoute d'abord un client dans la page Clients.</div>`;
    }
    });
  </script>
</body>
</html>
